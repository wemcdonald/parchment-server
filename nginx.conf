server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 4m;

    # extend default MIME map (don't replace it)
    include /etc/nginx/mime.types;
    types { application/wasm wasm; }

    # web.css references ../fonts/iosevka/* which resolves to /fonts/.
    # The actual files live under /public/fonts/.
    location /fonts/ {
        alias /usr/share/nginx/html/public/fonts/;
    }

    location /api/saves/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header X-Authentik-Username $http_x_authentik_username;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location ~ \.html$ {
        add_header Content-Disposition "inline" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Storyfiles: revalidate every fetch via ETag/Last-Modified so updating
    # the bind-mounted file is picked up on next reload (304 if unchanged).
    location ~ \.(zblorb|zlb|z3|z4|z5|z8|ulx|gblorb|blb|blorb|hex|dat|gam|t3|taf)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
